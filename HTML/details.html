<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>Booking details</title>
        <link href="../CSS/style.css" rel="stylesheet"/>
        <script defer="" src="../JS/script.js"></script>
    </head>
    <body class="is-details">
        <div class="app-shell">
            <main class="details-page search-page" id="app-content">
                <header class="search-header">
                    <a label="Go back" class="arrow1" href="confirm.html">←</a>
                    <img class="bell" src="../assets/bell.png"/>
                </header>
                <div class="booked">
                    <span class="check">✓</span>
                    <span>Booked</span>
                </div>
                <h1 class="booking-time">8:00 AM</h1>
                <div class="booking-date">
                    <img class="calendar-icon-img" src="../assets/cad1.png"/>
                    <span>Thursday, Nov 12 · in 6 days</span>
                </div>

                <section class="route-card">
                    <div class="route-line"></div>
                    <div class="route-point">
                        <span class="route-time">8:00</span>
                        <span class="start"></span>
                        <div class="location-info">
                            <h2 class="fw700">Lakeside Apartment</h2>
                            <span class="arrival-note">Arrive 5 min early</span>
                        </div>
                    </div>
                    <div class="route-point destination-point">
                        <span class="route-time">8:35</span>
                        <span class="end"></span>
                        <div class="location-info">
                            <h2 class="fw700">Sheridan College</h2>
                        </div>
                    </div>
                    <span class="route-action">Route →</span>
                </section>

                <section class="driver-card">
                    <img class="driver-photo" src="../assets/ui2.png"/>
                    <div class="driver-info">
                        <div class="driver-name">Steven <span class="verified">✓</span></div>
                        <p>White Honda Civic</p>
                    </div>
                    <div class="plate-row">
                        <span class="license-plate">BXKT 482</span>
                        <span class="message-circle">
                        <span class="chat-symbol">•••</span>
                     </span>
                     
                    </div>
                    
                </section>

                <div><img class="riders" src="../assets/more riders.png"/></div>

                <div class="booking-bottom">
                    <button class="calendar-action1" type="button"><img class="calendar-icon-img" src="../assets/cad1.png"/> <span class="fw700">Add to calendar</span></button>
                    <span class="cancel-booking">Cancel booking</span>
                </div>
            </main>

            <nav aria-label="Main navigation" class="floating-nav">
                <img src="../assets/menu.png"/>
                <a aria-label="Home" class="home-link" href="index.html"></a>
                <a aria-label="Find rides" class="find-link" href="search.html"></a>
                <a aria-label="Post a ride" class="post-link" href="post.html"></a>
                
            </nav>
        </div>
    </body>
</html>
