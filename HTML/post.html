<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>Post a ride</title>
        <link href="../CSS/style.css" rel="stylesheet"/>
        <script defer="" src="../JS/script.js"></script>
    </head>
    <body class="is-home">
        <div class="app-shell">
            <main class="home-page title" id="app-content">
                <h1>Post a ride</h1>
                <section class="home-card">
                    <div class="row">
                        <span class="start"></span>
                        <div class="text">
                            <h2>Lakeside Apartment</h2>
                            <p>144 Front St, Oakville</p>
                        </div>
                    </div>
                    <div class="separator"></div>
                    <img class="decoration" src="../assets/change.png"/>
                    <div class="row">
                        <span class="end"></span>
                        <div class="text">
                            <h2>Sheridan College</h2>
                            <p>Trafalgar Rd campus</p>
                        </div>
                    </div>
                </section>
                <img class="date" src="../assets/date.png"/>

                <div class="seats-row">
                    <div class="seats-text">
                    <h2>Seats</h2>
                    </div>

                <div class="seat-counter">
                    <button label="Decrease seats" class="seat-circle" type="button">-</button>
                    <span class="seat-number">1</span>
                    <button label="Increase seats" class="seat-circle" type="button">+</button>
                </div>
            </div>

            <div class="seats-separator"></div>

            <div class="seats-row">
                        <div class="seats-text">
                            <h2>Price per seat</h2>
                            <p>Set by distance · 38 km</p>
                        </div>
                        <div class="price"><strong>$12</strong></div>
                              
            </div>
            <div><span class="cancel-pill1">Tip: similar rides on this route cost $10–14 per seat</span>

             <button class="confirm-button1" id="confirm-trip1">Confirm</button>           
                        

            
                        
                
            </main>
            
            
             

            <nav label="Main navigation" class="floating-nav">
                <img src="../assets/menu.png"/>
                <a label="Home" class="home-link" href="index.html"></a>
                <a label="Find rides" class="find-link" href="search.html"></a>
                <a label="Post a ride" class="post-link" href="post.html"></a>
                
            </nav>
        </div>
        
       
    </body>
</html>
